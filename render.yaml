# render.yaml — versión con Docker, worker de Celery embebido (plan gratuito)
services:

  # ── Aplicación Web Django ──────────────────────────────────────
  - type: web
    name: erp-django-utec
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon

    # ENTRYPOINT ya definido en Dockerfile → no se necesita buildCommand
    # ni startCommand.

    healthCheckPath: /

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings_prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: erp-django-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"

      # W16: Celery + Redis (Key Value de Render)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: erp-django-redis
          property: connectionString
      - key: REDIS_CACHE_URL
        fromService:
          type: keyvalue
          name: erp-django-redis
          property: connectionString
        # En producción ideal usar una segunda instancia para separar
        # broker y caché. En el plan gratuito se usa la misma.
      - key: CELERY_EMBEDDED_WORKER  # 1 = worker dentro del contenedor web
        value: "1"

      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # W17: correo transaccional con SendGrid (los valores se capturan en el panel de Render)
      - key: EMAIL_BACKEND
        value: anymail.backends.sendgrid.EmailBackend
      - key: SENDGRID_API_KEY        # SG.xxxx (permiso Mail Send)
        sync: false
      - key: DEFAULT_FROM_EMAIL      # ERP Django <sender-verificado@...>
        sync: false
      - key: ADMIN_EMAIL             # recibe alertas de stock y errores 500
        sync: false

      # AWS S3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false

  # ── Redis / Key Value ──────────────────────────────────────────
  - type: keyvalue
    name: erp-django-redis
    plan: free
    region: oregon
    ipAllowList: []      # solo acceso interno desde tus servicios de Render

  # ── Celery Worker y Beat ───────────────────────────────────────
  # Render NO ofrece el plan gratuito para servicios tipo "worker", y con
  # CELERY_EMBEDDED_WORKER=1 el worker ya corre dentro del servicio web.
  # Si algún día pasas a un plan de pago, descomenta estos bloques.
  #
  # - type: worker
  #   name: erp-django-celery-worker
  #   env: docker
  #   dockerfilePath: ./Dockerfile
  #   dockerContext: .
  #   plan: starter
  #   startCommand: celery -A core worker -l info -Q erp_django
  #   envVars:
  #     - key: DJANGO_SETTINGS_MODULE
  #       value: core.settings_prod
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: erp-django-db
  #         property: connectionString
  #     - key: REDIS_URL
  #       fromService:
  #         type: keyvalue
  #         name: erp-django-redis
  #         property: connectionString
  #     - key: EMAIL_BACKEND
  #       value: anymail.backends.sendgrid.EmailBackend
  #     - key: SENDGRID_API_KEY
  #       sync: false
  #     - key: DEFAULT_FROM_EMAIL
  #       sync: false
  #     - key: ADMIN_EMAIL
  #       sync: false
  #
  # - type: worker
  #   name: erp-django-celery-beat
  #   env: docker
  #   dockerfilePath: ./Dockerfile
  #   dockerContext: .
  #   plan: starter
  #   numInstances: 1    # CRÍTICO: el Beat solo debe tener 1 instancia
  #   startCommand: celery -A core beat -l info
  #   envVars:
  #     - key: DJANGO_SETTINGS_MODULE
  #       value: core.settings_prod
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: erp-django-db
  #         property: connectionString
  #     - key: REDIS_URL
  #       fromService:
  #         type: keyvalue
  #         name: erp-django-redis
  #         property: connectionString

# ── Base de Datos ──────────────────────────────────────────────
databases:
  - name: erp-django-db
    plan: free
    region: oregon
    databaseName: erp_db
    user: erp_user